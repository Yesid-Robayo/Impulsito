# Comprueba cada push a develop y main: formato, reglas del código, lint, pruebas JVM, capturas y compilación.
# Corre en Windows, como el equipo de desarrollo: la verificación de dependencias tiene las sumas de los artefactos de Windows.
# No usa secretos: el APK release sale sin firmar. La firma solo ocurre en el equipo de quien publica.
name: CI

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Pruebas, lint y compilación
        run: ./gradlew.bat :domain:test check assembleDebug assembleRelease --console=plain
